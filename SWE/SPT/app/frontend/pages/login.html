<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>SPT Login Page</title>
        <link rel="icon" href="../assets/images/spt_favicon.png">
        <link rel="stylesheet" href="../styles/base.css">
    </head>

    <body>
        <header>
            <h1>
                Login
                <img
                    src="../assets/images/true_spt_logo_transparent.png"
                    alt="SPT Logo"
                    height="100"
                >
            </h1>

            <nav class="navbar">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="password_gen.html">Use Password Generator</a></li>
                    <li><a href="password_manager.html">Password Manager</a></li>
                </ul>
            </nav>

            <hr>
        </header>

        <main>
            <form action="login/" method="post">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" placeholder="johndoe123" required>

                <label for="password">Password</label>
                <input type="password" name="password" id="password" required>

                <input type="submit">
            </form>
        
            <a href="reset_password.html">Forgot Password?</a>

            <a href="register.html">Create Account</a>
        </main>

        <footer>
            <hr>
            <p>created by E. Ruffin</p>
            &copy; copyright reserved
        </footer>

    </body>
</html>
