<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>SPT Password Generator</title>
        <link rel="icon" href="../assets/images/spt_favicon.png">
        <link rel="stylesheet" href="../styles/base.css">
    </head>

    <body>
        <header>
            <h1>
                SPT Password Generator
            </h1>
            <hr>
        </header>

        <main>
            <form action="password_gen/" method="post">

                <label for="num-of-passwords">Number of passwords you would like to generate?</label>
                <select name="num_of_passwords" id="num-of-passwords">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
                <br>

                <label for="password-length">Desired password length?</label>
                <select name="password_length" id="password-length">
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                    <option value="13">13</option>
                    <option value="14">14</option>
                    <option value="15">15</option>
                </select>
                <br>

                <button type="button">Generate</button>
                <button type="button">Copy to Clipboard</button>
            </form>
        </main>

        <footer>
            <hr>
            <p>created by E. Ruffin</p>
            &copy; copyright reserved
        </footer>
    </body>
</html>
