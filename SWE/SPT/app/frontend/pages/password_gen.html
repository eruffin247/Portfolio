<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>SPT Password Generator</title>
        <link rel="icon" href="../assets/images/spt_favicon.png">
        <link rel="stylesheet" href="../styles/base.css">
    </head>

    <body>
        <header>
            <h1>
                SPT Password Generator
                <img
                    src="../assets/images/true_spt_logo_transparent.png"
                    alt="SPT Logo"
                    height="100"
                >
            </h1>

            <nav class="navbar">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="password_gen.html">Use Password Generator</a></li>
                    <li><a href="password_manager.html">Password Manager</a></li>
                </ul>
            </nav>

            <hr>
        </header>

        <main>
            <div class="generation-block">
                <form action="password_gen/" method="post">
                    <div class="password-config">
                        <label for="num-of-passwords">Number of passwords you would like to generate?</label>
                        <select name="num_of_passwords" id="num-of-passwords">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </div>

                    <div class="password-config">
                        <label for="password-length">Desired password length?</label>
                        <select name="password_length" id="password-length">
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                            <option value="13">13</option>
                            <option value="14">14</option>
                            <option value="15">15</option>
                        </select>
                    </div>

                    <div class="password-config">
                        <input type="checkbox" name="special_characters" id="special-characters">
                        <label for="special-characters">Special Characters</label>
                    </div>

                    <div class="password-config">
                        <input type="checkbox" name="number_characters" id="number-characters">
                        <label for="number-characters">Numbers</label>
                    </div>

                    <div class="generate-password">
                        <button type="button">Generate</button>
                    </div>
                </form>
            </div>

            <div class="copy">
                <form action="copy_to_clipboard/" method="post">
                    <button type="button">Copy to Clipboard</button>
                </form>
            </div
        </main>

        <footer>
            <hr>
            <p>created by E. Ruffin</p>
            &copy; copyright reserved
        </footer>
    </body>
</html>
