<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>SPT Password Generator</title>
    </head>

    <body>
        <h1>SPT Password Generator</h1>

        <main>
            <form action="password_gen/" method="post">

                <label for="num_of_passwords">Number of passwords you would like to generate (1-10):</label>
                <input
                    type="number"
                    name="num_of_passwords"
                    min="1"
                    max="10"
                    value=""
                >
            </form>
        </main>

        <button>Generate</button>
        <button>Copy to Clipboard</button>
    </body>
</html>
